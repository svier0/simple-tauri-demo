[package]
name = "dsh"
version = "0.1.0"
description = "A Tauri App"
authors = ["心衍"]
edition = "2021"

[lib]
name = "dsh_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# simple-tauri = "0.2"
simple-tauri = { path = "../../simple-tauri/" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = 'thin'
opt-level = 'z'
panic = "abort"
strip = true
